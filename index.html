<!DOCTYPE html>
<html>
<head>
  <title>Simple UI</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
    }
    button {
      padding: 10px 15px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Welcome</h2>
    <p>This is a simple UI example</p>
    <button onclick="alert('Hello!')">Click Me</button>
  </div>

</body>
</html>
